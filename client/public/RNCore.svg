<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Tech Background Card -->
  <rect width="600" height="600" rx="120" fill="#0B0F19"/>
  <rect x="20" y="20" width="560" height="560" rx="100" stroke="#1E293B" stroke-width="8"/>

  <!-- Left Code Bracket Symbol `<` (Developer Vibe) -->
  <path d="M 120 220 L 60 300 L 120 380" stroke="#38BDF8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main 'R' Letter Structure -->
  <!-- 'R' Vertical Spine (Database Connection Line) -->
  <path d="M 210 140 V 460" stroke="url(#r-spine-grad)" stroke-width="48" stroke-linecap="round"/>

  <!-- 'R' Top Loop with Database Layers Inside -->
  <path d="M 210 164 H 340 C 400 164 440 200 440 250 C 440 300 400 336 340 336 H 210" stroke="url(#r-loop-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 'R' Leg Transforming into API Arrow Output -->
  <path d="M 310 336 L 430 460" stroke="#06B6D4" stroke-width="48" stroke-linecap="round"/>

  <!-- Live API Glowing Core Node (Point on R's Top Right) -->
  <circle cx="440" cy="250" r="20" fill="#22D3EE"/>
  <circle cx="440" cy="250" r="32" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="8"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="r-spine-grad" x1="210" y1="140" x2="210" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="r-loop-grad" x1="210" y1="164" x2="440" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
</svg>
